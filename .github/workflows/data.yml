name: data
# Watches the market: refreshes quotes, calendars, prices and filings, queues story events for the writer, and
# dispatches build.yml to redeploy the site with fresh prices. pipeline/watch.py loops inside one job (every 15
# minutes on weekdays, hourly in the evening) and hands over to a fresh run before the 6-hour job limit, because
# GitHub drops most runs of a busy cron. The crons below are only starters and backups, at odd minutes (the top
# of the hour is when GitHub drops the most). A run that starts while another is looping waits its turn.
on:
  schedule:
    - cron: "7,37 10-23 * * 1-5"   # weekday starters/backups, ~5-7 a.m. ET onward
    - cron: "7,37 0-4 * * 2-6"     # weekday evenings, ET
    - cron: "17 */3 * * 0,6"       # weekends: one pass each (previews and the week ahead)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: data-watch
  cancel-in-progress: false
jobs:
  data:
    if: vars.MM_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull market data
        run: bash pipeline/data_pull.sh
      - name: Watch the market
        env:
          GH_TOKEN: ${{ github.token }}
          MM_ENABLED: ${{ vars.MM_ENABLED }}
          FIRE_URL: ${{ secrets.MM_ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.MM_ROUTINE_FIRE_TOKEN }}
        run: |
          git config user.name "mm-bot"
          git config user.email "bot@mostlymarkets.org"
          python3 pipeline/watch.py
