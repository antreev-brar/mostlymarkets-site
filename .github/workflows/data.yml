name: data
# Watches the market around the clock: refreshes quotes, calendars, prices, filings and headlines, queues story
# events for the writer, and dispatches build.yml to redeploy the site. pipeline/watch.py loops inside one job (every
# 15 minutes in weekday market hours, every 30 minutes at all other times) and, before the 6-hour job limit, queues its
# own successor, so the chain never depends on GitHub's scheduler, which fired 2 of 39 night and weekend slots in the
# first week. The crons below only restart the chain if it ever breaks, at odd minutes (the top of the hour is when
# GitHub drops the most). A run that starts while another is looping waits its turn.
on:
  schedule:
    - cron: "7,37 * * * *"   # backups: a pending run just waits for the looping one (and replaces older pending runs)
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  issues: write   # pipeline/health.py's "Site health" issue
concurrency:
  group: data-watch
  cancel-in-progress: false
jobs:
  data:
    if: vars.MM_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull market data
        run: bash pipeline/data_pull.sh
      - name: Watch the market
        env:
          GH_TOKEN: ${{ github.token }}
          MM_ENABLED: ${{ vars.MM_ENABLED }}
          FIRE_URL: ${{ secrets.MM_ROUTINE_FIRE_URL }}
          FIRE_TOKEN: ${{ secrets.MM_ROUTINE_FIRE_TOKEN }}
        run: |
          git config user.name "mm-bot"
          git config user.email "bot@mostlymarkets.org"
          python3 pipeline/watch.py
